name: Secret scan

on:
  push:
  pull_request:

# gitleaks-action lists a pull request's commits through the API on pull_request events.
# Without pull-requests: read it stops with "Resource not accessible by integration"
# before scanning anything.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
